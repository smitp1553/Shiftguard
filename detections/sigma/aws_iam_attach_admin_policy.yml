title: AWS IAM Admin Policy Attached To User Role Or Group
id: 9df0576f-7a4b-42b4-919e-4df8e506da13
status: experimental
description: >
    AdministratorAccess or IAMFullAccess was attached to a user, role or group.
    This is the end step of the AttachUserPolicy and AttachRolePolicy escalation techniques.
    TODO: custom policies that are admin in practice are not recognised, only the two AWS managed ones.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachUserPolicy.html
author: SMIT
date: 2026-10-22
tags:
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - AttachUserPolicy
            - AttachRolePolicy
            - AttachGroupPolicy
        requestParameters.policyArn|endswith:
            - ':policy/AdministratorAccess'
            - ':policy/IAMFullAccess'
    condition: selection
falsepositives:
    - Account setup and break-glass procedures run by your administrators.
    - Infrastructure pipelines that create admin roles on purpose.
level: high
