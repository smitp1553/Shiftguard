title: AWS IAM Console Password Set For A Different User
id: bc904acf-b105-4aeb-b129-09db300339cf
status: experimental
description: >
    A console password was created or changed for an IAM user other than the caller.
    An attacker with iam:CreateLoginProfile or iam:UpdateLoginProfile can set a password for a
    more powerful user and sign in as them.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateLoginProfile.html
author: SMIT
date: 2026-10-22
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - CreateLoginProfile
            - UpdateLoginProfile
        requestParameters.userName|exists: true
    filter_self:
        requestParameters.userName|fieldref: userIdentity.userName
    condition: selection and not filter_self
falsepositives:
    - Help desk or administrators who reset passwords for users.
level: high
