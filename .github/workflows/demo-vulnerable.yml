name: demo-vulnerable

# run this by hand (Actions tab -> Run workflow) to show what a failing build looks like
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: analyze lab-vulnerable (this job is meant to FAIL)
        run: python -m shiftguard.cli terraform/lab-vulnerable/plan.json