title: AWS IAM Policy Default Version Changed
id: edc2ec3e-ca28-42cd-8bfa-20ec3e91ef0e
status: experimental
description: >
    The default version of an IAM managed policy was switched. An attacker with
    iam:SetDefaultPolicyVersion can roll a policy back to an older, more permissive version.
    This is the second half of the CreatePolicyVersion technique when setAsDefault was not used.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_SetDefaultPolicyVersion.html
author: SMIT
date: 2026-10-22
tags:
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: SetDefaultPolicyVersion
    condition: selection
falsepositives:
    - Planned rollbacks of a policy change by administrators.
level: medium
