title: AWS IAM Policy Version Created And Set As Default
id: f33bf442-33f8-4e80-8dec-72d2bcb12abd
status: experimental
description: >
    A new version of an IAM managed policy was created and set as the default in one call.
    An attacker with iam:CreatePolicyVersion can rewrite a policy attached to themselves,
    for example to Action * on Resource *, and it takes effect at once.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreatePolicyVersion.html
author: SMIT
date: 2026-10-22
tags:
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: CreatePolicyVersion
        requestParameters.setAsDefault: true
    condition: selection
falsepositives:
    - Administrators or CI pipelines that update managed policies on purpose. Compare the caller with your approved policy-change roles.
    - Failed attempts (errorCode AccessDenied) also match. That is wanted, an attempt is worth a look.
level: high
