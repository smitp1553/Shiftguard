title: AWS IAM Role Trust Policy Changed
id: f6b839f2-c667-409f-9d13-11dda7969252
status: experimental
description: >
    The trust policy of an IAM role was rewritten. An attacker with iam:UpdateAssumeRolePolicy
    can add their own identity to a powerful role's trust policy and then assume the role.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAssumeRolePolicy.html
author: SMIT
date: 2026-10-22
tags:
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: UpdateAssumeRolePolicy
    condition: selection
falsepositives:
    - Infrastructure pipelines that manage role trust policies. Allow-list the pipeline role.
level: high
